x-app: &app
    image: ${APP_IMAGE:-regray-app:local}
    env_file: ${APP_ENV_FILE:-.env.docker}
    restart: unless-stopped
    security_opt:
        - no-new-privileges:true
    cap_drop:
        - ALL
    logging: &logging
        driver: json-file
        options:
            max-size: '10m'
            max-file: '5'
    depends_on:
        db:
            condition: service_healthy

services:
    app:
        <<: *app
        build:
            context: .
            target: app
            args:
                VITE_ASSET_URL: ${VITE_ASSET_URL:-}
        networks:
            - frontend
            - backend
        mem_limit: 512m
        pids_limit: 200

    # Horizon when the queue is on Redis, queue:work on the database queue.
    # The test is config/queue.php's: redis needs REDIS_HOST too.
    worker:
        <<: *app
        command:
            - sh
            - -c
            - >-
                if [ "$${QUEUE_CONNECTION:-}" = redis ] && [ -n "$${REDIS_HOST:-}" ];
                then exec php artisan horizon;
                else exec php artisan queue:work --tries=3 --max-time=3600;
                fi
        init: true
        stop_grace_period: 60s
        # This process does not run FPM, so the image's /ping check does not apply.
        healthcheck:
            disable: true
        networks:
            - backend
        mem_limit: 256m

    # The WebSocket server for the Message page. Caddy proxies /app/* to it, so
    # browsers connect on the same origin as the app.
    reverb:
        <<: *app
        command:
            ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        init: true
        stop_grace_period: 30s
        # This process does not run FPM, so the image's /ping check does not apply.
        healthcheck:
            disable: true
        networks:
            - frontend
            - backend
        mem_limit: 256m

    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']
        init: true
        healthcheck:
            disable: true
        networks:
            - backend
        mem_limit: 128m

    web:
        image: ${WEB_IMAGE:-regray-web:local}
        build:
            context: .
            target: web
            args:
                VITE_ASSET_URL: ${VITE_ASSET_URL:-}
        ports:
            - '${WEB_HTTP_PORT:-80}:80'
            - '${WEB_HTTPS_PORT:-443}:443'
            - '${WEB_HTTPS_PORT:-443}:443/udp'
        environment:
            APP_DOMAIN: ${APP_DOMAIN:-:80}
        volumes:
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            app:
                condition: service_healthy
        networks:
            - frontend
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        cap_add:
            - NET_BIND_SERVICE
        security_opt:
            - no-new-privileges:true
        logging: *logging
        mem_limit: 128m
        restart: unless-stopped

    # Cache and queues, used once CACHE_STORE / QUEUE_CONNECTION are `redis`
    # and REDIS_HOST=redis. Off unless COMPOSE_PROFILES includes `redis`, so a
    # stack on the database drivers runs exactly as before. Append-only and no
    # eviction, because queued jobs live here too. Valkey is the BSD-licensed
    # fork of Redis; Laravel's `redis` drivers and Horizon talk to it unchanged.
    redis:
        image: valkey/valkey:9.0-alpine
        profiles: ['redis']
        command:
            [
                'valkey-server',
                '--appendonly',
                'yes',
                '--maxmemory-policy',
                'noeviction',
            ]
        volumes:
            - redisdata:/data
        healthcheck:
            test: ['CMD', 'valkey-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - backend
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        logging: *logging
        mem_limit: 256m

    db:
        image: postgres:17.11-trixie
        environment:
            POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE via --env-file}
            POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME via --env-file}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD via --env-file}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
        networks:
            - backend
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        logging: *logging

networks:
    frontend:
    backend:

volumes:
    pgdata:
    redisdata:
    caddy_data:
    caddy_config:
