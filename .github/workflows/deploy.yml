name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.image-owner.outputs.owner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate asset URL
        env:
          VITE_ASSET_URL: ${{ vars.VITE_ASSET_URL }}
        run: |
          if [[ -z "${VITE_ASSET_URL//[[:space:]]/}" ]]; then
            echo "::error::Repository variable VITE_ASSET_URL must be set before building production images."
            exit 1
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image owner
        id: image-owner
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          printf 'OWNER=%s\n' "$OWNER" >> "$GITHUB_ENV"
          printf 'owner=%s\n' "$OWNER" >> "$GITHUB_OUTPUT"

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: app
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/regray-studio-app:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/regray-studio-app:latest
          build-args: |
            VITE_ASSET_URL=${{ vars.VITE_ASSET_URL }}
          cache-from: type=gha,scope=production-app
          cache-to: type=gha,mode=max,scope=production-app

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: web
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/regray-studio-web:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/regray-studio-web:latest
          build-args: |
            VITE_ASSET_URL=${{ vars.VITE_ASSET_URL }}
          cache-from: type=gha,scope=production-web
          cache-to: type=gha,mode=max,scope=production-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy production Compose file
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            docker-compose.yml "${SSH_USER}@${SSH_HOST}:/srv/regray-studio/docker-compose.yml"

      - name: Deploy production
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          OWNER: ${{ needs.build.outputs.owner }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" "bash -s -- '$OWNER' '$GITHUB_SHA'" <<'SCRIPT'
          set -euo pipefail
          OWNER="$1"
          GITHUB_SHA="$2"
          cd /srv/regray-studio

          for file in .env .env.production; do
            if [[ ! -f "$file" ]]; then
              printf 'ERROR: Required server file /srv/regray-studio/%s is missing.\n' "$file" >&2
              exit 1
            fi
          done

          sed -i \
            -e "s|^APP_IMAGE=.*|APP_IMAGE=ghcr.io/${OWNER}/regray-studio-app:${GITHUB_SHA}|" \
            -e "s|^WEB_IMAGE=.*|WEB_IMAGE=ghcr.io/${OWNER}/regray-studio-web:${GITHUB_SHA}|" \
            .env

          docker compose pull
          docker compose up -d --no-build --wait --wait-timeout 180 db
          docker compose run --rm app php artisan migrate --force
          docker compose up -d --no-build --remove-orphans --wait --wait-timeout 180
          docker compose ps
          docker image prune -f
          printf 'Deployed SHA: %s\n' "$GITHUB_SHA"
          SCRIPT
