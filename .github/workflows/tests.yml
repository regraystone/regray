name: tests

# Each change is tested once, on its pull request, which GitHub runs against the
# branch merged into its target. A merge into dev is not tested again, and main
# is tested by the Deploy workflow, which calls this one before it builds, so
# only a passing commit is deployed.
#
# A pull request that changes only Markdown or docs/ starts no run.
on:
  workflow_call:
  pull_request:
    branches:
      - dev
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails the run when a dependency has a known advisory, so a new one blocks a
  # deploy instead of waiting for Dependabot's weekly pass. The JS audit ignores
  # devDependencies: the test toolchain never ships to production. A newly
  # published advisory can fail this on an unrelated change; bump the dependency
  # (or wait for Dependabot) to clear it.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Audit npm dependencies (production only)
        run: npm audit --omit=dev --audit-level=high

  tests:
    runs-on: ubuntu-latest

    # Application setup copies .env.example to .env, which names the application's
    # own database. The Feature suite runs migrate:fresh, so pointing that at
    # the real database would wipe it. Redirect it to the throwaway one so a
    # single database serves both the setup migration and the tests.
    #
    # Only the name differs: host, port, user, password and driver already
    # match .env.example, and phpunit.xml repeats them for local runs.
    env:
      DB_DATABASE: regray-test

    services:
      # The same major version the project develops against locally, so the
      # migrations are proven against the engine they will actually meet.
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: regray-test
          POSTGRES_USER: root
          # Trust auth matches the local server, which takes `root` with no
          # password. Nothing here is a real credential.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root -d regray-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          # pdo_pgsql is not in setup-php's default set, and the whole suite
          # now runs on Postgres.
          extensions: pgsql, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Setup Application
        run: |
          composer install --no-interaction --prefer-dist
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate --no-interaction
          php artisan migrate --force --no-interaction
          php artisan wayfinder:generate --no-interaction
          npm ci
          npm run build

      - name: Run CI Checks
        run: composer ci:check

      # The images are built only on a pull request to main, so a broken
      # Dockerfile is caught before it can block a deploy. Everywhere else
      # they are not needed: Deploy builds and pushes its own after this.
      - name: Setup Docker Buildx
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build app image
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: app
          push: false
          build-args: |
            VITE_ASSET_URL=https://example.invalid
          cache-from: type=gha,scope=tests-app
          cache-to: type=gha,mode=max,scope=tests-app

      - name: Build web image
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: web
          push: false
          build-args: |
            VITE_ASSET_URL=https://example.invalid
          cache-from: type=gha,scope=tests-web
          cache-to: type=gha,mode=max,scope=tests-web
