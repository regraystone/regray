# Local only: Compose auto-loads this file. Do not deploy it.
# Use only -f docker-compose.yml in production.
services:
    # Share local public/private files between PHP processes and preserve uploads.
    app:
        # Dev packages (Faker for the demo seeders) in the local image only.
        build:
            args:
                COMPOSER_DEV: 'true'
        volumes:
            - ./storage/app:/var/www/html/storage/app
    worker:
        volumes:
            - ./storage/app:/var/www/html/storage/app
    scheduler:
        volumes:
            - ./storage/app:/var/www/html/storage/app
    web:
        # Must match app's: the web image copies public/build from its own
        # build of the app stage, and the asset hashes differ with dev packages.
        build:
            args:
                COMPOSER_DEV: 'true'
        volumes:
            - ./storage/app/public:/var/www/html/public/storage:ro
