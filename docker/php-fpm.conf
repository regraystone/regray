[www]
listen = 9000
clear_env = no

; The master and workers inherit USER www-data; no user/group directives are needed.
pm = dynamic
; Budget about 320 MB of the 512 MB app limit for workers on a 1-2 GB host.
; Size max_children as that budget / measured peak worker RSS (about 80 MB here).
; Reduce it if workers use more memory; reserve headroom for OPcache and the master.
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500

ping.path = /ping
ping.response = pong
catch_workers_output = yes
decorate_workers_output = no
